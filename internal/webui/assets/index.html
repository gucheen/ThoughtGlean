<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f7f8fa">
    <title>拾念 · ThoughtGlean</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="brandButton" class="brand" type="button" aria-label="回到最近记录">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-copy"><strong>拾念</strong></span>
        </button>

        <label class="search-box">
          <span class="search-icon" aria-hidden="true"></span>
          <span class="sr-only">搜索笔记</span>
          <input id="searchInput" type="search" placeholder="搜索记录" autocomplete="off">
          <kbd>/</kbd>
          <button id="clearSearchButton" class="clear-search" type="button" aria-label="清除搜索" hidden>×</button>
        </label>

        <button id="newNoteButton" class="button button-primary top-new" type="button">
          <span aria-hidden="true">＋</span><span class="button-label">新记录</span>
        </button>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <nav aria-label="笔记视图">
            <button class="nav-item active" type="button" data-view="recent">最近</button>
            <button class="nav-item" type="button" data-view="starred">星标</button>
            <button class="nav-item" type="button" data-view="all">全部记录</button>
          </nav>
          <nav class="sidebar-secondary" aria-label="数据管理">
            <button class="nav-item" type="button" data-view="trash">回收站</button>
          </nav>
          <div class="storage-note">
            <span class="status-dot"></span>
            <span>本地保存<small>数据只在你的目录中</small></span>
          </div>
        </aside>

        <main class="main-content">
          <section id="libraryView">
            <header class="view-heading">
              <h1 id="viewTitle">最近</h1>
              <p id="viewSummary" class="muted"></p>
            </header>

            <form id="captureForm" class="capture-card">
              <div id="continuationChip" class="continuation-chip" hidden>
                <span>续自记录</span><button id="clearContinuationButton" type="button" aria-label="取消续记">×</button>
              </div>
              <label class="sr-only" for="captureInput">新记录</label>
              <textarea id="captureInput" rows="3" maxlength="1048576" placeholder="写下想法…"></textarea>
              <p id="captureError" class="inline-error" role="alert"></p>
              <footer class="capture-footer">
                <span id="draftState" class="draft-state">草稿会自动保存在本机</span>
                <div class="capture-actions">
                  <span class="shortcut-hint"><kbd>⌘</kbd><kbd>↵</kbd> 保存</span>
                  <button id="captureSubmit" class="button button-primary" type="submit">保存</button>
                </div>
              </footer>
            </form>

            <div id="loadingState" class="loading-state">正在加载…</div>
            <div id="timeline" class="timeline" aria-live="polite"></div>
            <section id="emptyState" class="empty-state" hidden>
              <h2 id="emptyTitle">还没有记录</h2>
              <p id="emptyDescription">写下第一条内容。</p>
            </section>
          </section>

          <section id="noteView" hidden>
            <header class="note-toolbar">
              <button id="backButton" class="text-button" type="button">← 返回</button>
              <div class="note-toolbar-actions">
                <button id="starNoteButton" class="text-button" type="button">☆ 星标</button>
                <button id="editNoteButton" class="text-button" type="button">编辑</button>
                <button id="deleteNoteButton" class="text-button danger" type="button">移到回收站</button>
              </div>
            </header>

            <div class="note-detail-layout">
              <article class="note-paper">
                <div class="note-origin">
                  <time id="noteCreatedAt"></time>
                  <span id="noteSaveState">已保存</span>
                </div>
                <input id="noteTitleInput" class="note-title-input" type="text" maxlength="500" placeholder="标题（可选）" readonly>
                <div id="noteRendered" class="note-rendered"></div>
                <label class="sr-only" for="noteEditor">笔记正文</label>
                <textarea id="noteEditor" class="note-editor" maxlength="1048576" hidden></textarea>
                <div id="editActions" class="edit-actions" hidden>
                  <button id="cancelEditButton" class="button button-ghost" type="button">取消</button>
                  <button id="saveEditButton" class="button button-primary" type="button">保存修改</button>
                </div>
              </article>

              <aside class="context-rail">
                <h2>相关记录</h2>
                <p class="context-copy">这条记录前后的内容。</p>
                <div id="contextTimeline" class="context-timeline"></div>
                <button id="continueNoteButton" class="button button-secondary button-wide" type="button">继续写</button>
              </aside>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="/app.js" defer></script>
  </body>
</html>
