name: thoughtglean

services:
  server:
    build:
      context: .
      target: server
      args:
        THOUGHTGLEAN_VERSION: ${THOUGHTGLEAN_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      THOUGHTGLEAN_ADDR: :8080
      THOUGHTGLEAN_DATA_DIR: /data
      THOUGHTGLEAN_BACKUP_DIR: /backups
      THOUGHTGLEAN_BACKUP_INTERVAL: ${THOUGHTGLEAN_BACKUP_INTERVAL:-24h}
      THOUGHTGLEAN_BACKUP_KEEP: ${THOUGHTGLEAN_BACKUP_KEEP:-14}
      THOUGHTGLEAN_OWNER_TOKEN: ${THOUGHTGLEAN_OWNER_TOKEN:?请在 .env 中设置个人访问密钥}
      THOUGHTGLEAN_PASSKEY_RP_ID: ${THOUGHTGLEAN_PASSKEY_RP_ID:-localhost}
      THOUGHTGLEAN_PASSKEY_ORIGIN: ${THOUGHTGLEAN_PASSKEY_ORIGIN:-http://localhost:8080}
    volumes:
      - ${THOUGHTGLEAN_DATA_PATH:-thoughtglean-data}:/data
      - ${THOUGHTGLEAN_BACKUP_PATH:-thoughtglean-backups}:/backups
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${THOUGHTGLEAN_HTTP_BIND:-127.0.0.1}:${THOUGHTGLEAN_HTTP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

volumes:
  thoughtglean-data:
  thoughtglean-backups:
