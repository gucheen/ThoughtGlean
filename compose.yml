name: thoughtglean

services:
  server:
    image: ghcr.io/gucheen/thoughtglean-server:latest
    restart: unless-stopped
    environment:
      THOUGHTGLEAN_ADDR: :8080
      THOUGHTGLEAN_DATA_DIR: /data
      THOUGHTGLEAN_BACKUP_DIR: /backups
      THOUGHTGLEAN_BACKUP_INTERVAL: ${THOUGHTGLEAN_BACKUP_INTERVAL:-24h}
      THOUGHTGLEAN_BACKUP_KEEP: ${THOUGHTGLEAN_BACKUP_KEEP:-14}
      THOUGHTGLEAN_OWNER_TOKEN: ${THOUGHTGLEAN_OWNER_TOKEN:-}
      THOUGHTGLEAN_OIDC_ISSUER: ${THOUGHTGLEAN_OIDC_ISSUER:-}
      THOUGHTGLEAN_OIDC_CLIENT_ID: ${THOUGHTGLEAN_OIDC_CLIENT_ID:-}
      THOUGHTGLEAN_OIDC_CLIENT_SECRET: ${THOUGHTGLEAN_OIDC_CLIENT_SECRET:-}
      THOUGHTGLEAN_OIDC_REDIRECT_URL: ${THOUGHTGLEAN_OIDC_REDIRECT_URL:-}
      THOUGHTGLEAN_OIDC_OWNER_SUBJECT: ${THOUGHTGLEAN_OIDC_OWNER_SUBJECT:-}
    volumes:
      - ${THOUGHTGLEAN_DATA_PATH:-thoughtglean-data}:/data
      - ${THOUGHTGLEAN_BACKUP_PATH:-thoughtglean-backups}:/backups
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/gucheen/thoughtglean-web:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${THOUGHTGLEAN_HTTP_BIND:-127.0.0.1}:${THOUGHTGLEAN_HTTP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

volumes:
  thoughtglean-data:
  thoughtglean-backups:
